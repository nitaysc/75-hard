<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="300" height="380">
  <defs>
    <!-- Makes the HARD text edges rough / distressed -->
    <filter id="distress" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <!-- Dark red shadow under HARD -->
    <filter id="hardSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="3" flood-color="#7f1d1d" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Shield: broad, rounded top, pointed bottom -->
  <path d="M150 10
           C 210 10, 262 34, 262 60
           L 262 134
           C 262 206, 214 252, 150 264
           C 86 252, 38 206, 38 134
           L 38 60
           C 38 34, 90 10, 150 10 Z"
        fill="#ffffff" stroke="#2b2b2b" stroke-width="9" stroke-linejoin="round"/>
  <path d="M150 26
           C 198 26, 244 45, 244 66
           L 244 132
           C 244 194, 204 232, 150 244
           C 96 232, 56 194, 56 132
           L 56 66
           C 56 45, 102 26, 150 26 Z"
        fill="none" stroke="#45454c" stroke-width="4" stroke-linejoin="round"/>

  <!-- 75 (bold, centered) -->
  <text x="150" y="178" text-anchor="middle"
        font-family="'Arial Black','Arial',sans-serif" font-size="122" font-weight="900" fill="#000000">75</text>

  <!-- HARD (distressed red with dark red shadow) -->
  <text x="150" y="330" text-anchor="middle"
        font-family="'Arial Black','Arial',sans-serif" font-size="74" font-weight="900"
        letter-spacing="8" fill="#c81e1e" filter="url(#hardSh)">HARD</text>
  <text x="150" y="330" text-anchor="middle"
        font-family="'Arial Black','Arial',sans-serif" font-size="74" font-weight="900"
        letter-spacing="8" fill="#e33b3b" filter="url(#distress)">HARD</text>
</svg>
